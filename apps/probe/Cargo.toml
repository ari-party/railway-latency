[package]
name = "probe"
version = "1.0.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.14.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
time = { version = "0.3.44", features = ["formatting", "macros"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "time", "fs"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["json"] }
webpki-roots = "1.0.7"

[build-dependencies]
prettyplease = "0.2.37"
schemars = "0.8"
serde_json = "1.0.150"
syn = { version = "2.0.117", features = ["full"] }
typify = "0.6.2"
