---
- name: Ensure the systemd-resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure DNS resolvers
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/dns.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Resolve]
      DNS=1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4
      FallbackDNS=
  notify: Restart systemd-resolved

- name: Enable and start systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: true
    state: started

- name: Point /etc/resolv.conf at the stub resolver
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  notify: Restart systemd-resolved

- name: Check if NetworkManager is installed
  ansible.builtin.stat:
    path: /usr/sbin/NetworkManager
  register: nm_binary

- name: Ensure the NetworkManager drop-in directory exists
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: nm_binary.stat.exists

- name: Prevent NetworkManager from pushing DHCP DNS to systemd-resolved
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/10-no-dhcp-dns.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [main]
      dns=none
  when: nm_binary.stat.exists
  notify: Reload NetworkManager

- name: Install Ansible prerequisites and base hardening packages
  ansible.builtin.apt:
    name:
      - python3
      - ca-certificates
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# Some base images ship these timers masked, silently disabling all upgrades.
- name: Ensure the apt upgrade timers are enabled
  ansible.builtin.systemd:
    name: "{{ apt_timer }}"
    enabled: true
    state: started
    masked: false
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
  loop_control:
    loop_var: apt_timer
